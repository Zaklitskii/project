<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .heart-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .text-particle {
            position: absolute;
            color: red;
            font-size: 14px;
            white-space: nowrap;
            user-select: none;
            opacity: 0;
            animation: moveHeart 4s infinite linear;
        }

        @keyframes moveHeart {
            0% {
                transform: translate(var(--start-x), var(--start-y)) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--end-x), var(--end-y)) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="heart-container" id="container"></div>

    <script>
        const container = document.getElementById('container');
        const totalParticles = 150; // Кількість речень

        // Функція для отримання координат серця (математична формула серця)
        function getHeartPoint(t) {
            // t має бути від 0 до 2 * PI
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * 15, y: y * 15 }; // Множимо на 15 для масштабу
        }

        for (let i = 0; i < totalParticles; i++) {
            const particle = document.createElement('div');
            particle.className = 'text-particle';
            particle.innerText = 'I love you';

            // Розподіляємо точки по колу для формування серця
            const angle = (i / totalParticles) * 2 * Math.PI;
            const point = getHeartPoint(angle);

            // Центруємо анімацію на екрані
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // Встановлюємо змінні для CSS анімації
            particle.style.setProperty('--start-x', `${centerX}px`);
            particle.style.setProperty('--start-y', `${centerY}px`);
            particle.style.setProperty('--end-x', `${centerX + point.x}px`);
            particle.style.setProperty('--end-y', `${centerY + point.y}px`);

            // Випадкова затримка, щоб речення вилітали не одночасно
            particle.style.animationDelay = `${Math.random() * 4}s`;
            
            container.appendChild(particle);
        }

        // Оновлення координат при зміні розміру вікна
        window.addEventListener('resize', () => {
            location.reload(); 
        });
    </script>
</body>
</html>
